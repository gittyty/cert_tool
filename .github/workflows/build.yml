name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install MinGW-w64 (Windows cross-compiler)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64

    - name: Download Go dependencies
      run: |
        go mod tidy
        go mod download

    - name: Build EXE
      run: |
        export CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64
        go build -ldflags "-H windowsgui" -o cert-tool.exe .

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: cert-tool-windows
        path: cert-tool.exe

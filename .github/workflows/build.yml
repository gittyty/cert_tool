name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Zig
      run: |
        wget https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
        tar -xf zig-linux-x86_64-0.13.0.tar.xz
        echo "$(pwd)/zig-linux-x86_64-0.13.0/" >> $GITHUB_PATH

    - name: Tidy and download dependencies
      run: |
        go mod tidy
        go mod download

    - name: Build EXE
      run: |
        export CC="zig cc" CGO_ENABLED=1 GOOS=windows GOARCH=amd64
        go build -ldflags "-H windowsgui" -o cert-tool.exe .

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: cert-tool-windows
        path: cert-tool.exe
